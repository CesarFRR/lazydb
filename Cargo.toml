[package]
name = "lazydb"
version = "0.1.0"
edition = "2024"
description = "Terminal-first SQLite explorer inspired by lazygit/lazydocker"
license = "MIT"
readme = "README.md"
keywords = ["sqlite", "tui", "database", "cli"]
categories = ["command-line-utilities", "database"]
rust-version = "1.85"

[features]
# Interruptores de compilación por backend. Fase A: declarados con TODOS
# activos por defecto (el build actual no cambia). Fase B: gatear el código
# con `#[cfg(feature = "...")]` para poder compilar subconjuntos.
#
# `files` depende de `duckdb` porque el backend de archivos (parquet/csv/
# json/geojson/gpkg) se lee con duckdb internamente.
default = ["sqlite", "duckdb", "files", "mysql", "postgres", "mongodb"]
sqlite  = ["dep:rusqlite"]
duckdb  = ["dep:duckdb"]
files   = ["duckdb"]
mysql   = ["dep:mysql_async"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
# NoSQL: MongoDB (crate oficial `mongodb`). Sin serde tipado: `bson::Document`
# crudo + helpers manuales (interfaz de bajo nivel, ver WIP.md).
mongodb = ["dep:mongodb"]

# Meta-features de conveniencia: grupos por tipo de conexión
local   = ["sqlite", "duckdb", "files"]
remote  = ["mysql", "postgres"]
nosql   = ["mongodb"]

[dependencies]
ratatui = "0.29"
crossterm = "0.29"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
toml = "0.8"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
serde = { version = "1.0.229", features = ["derive"] }
duckdb = { version = "1.10505.0", features = ["bundled"], optional = true }
fallible-streaming-iterator = "0.1.9"
mysql_async = { version = "0.37.0", optional = true }
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
# `compat-3-3-0` (API estable) + `bson-2` (API clásica de bson, la que usa
# el driver por defecto) + `rustls-tls` (TLS sin openssl).
mongodb = { version = "3.8", default-features = false, features = ["compat-3-3-0", "bson-2", "rustls-tls"], optional = true }
futures-util = "0.3"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
